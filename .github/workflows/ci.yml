name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Branch protection on main requires this job by name.
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Fetch pinned sources
        run: npm run fetch
      - name: Rebuild dataset
        run: npm run build:data
      - name: Committed dataset and reports match a fresh build
        run: git diff --exit-code -- public/data data/reports
      - run: npm test
      - name: Build the site
        run: npm run build

  browser:
    # Branch protection on main requires this job by name.
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps --only-shell chromium
      - name: Check the site at every size, in light and dark
        run: node .claude/skills/run-pogo-stat-translation/driver.ts check --out shots
        env:
          # The Chromium that matches playwright-core, not whichever browser the runner image has.
          BROWSER_CHANNEL: chromium
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/
          retention-days: 7
